<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Detail Informasi Pendaftar</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 30px; 
            background-color: #f4f4f9; 
        }
        
        h2 { text-align: center; color: #333; }

        /* Desain Tabel */
        table { 
            width: 80%; 
            margin: 0 auto; 
            border-collapse: collapse; 
            background-color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        th, td { 
            border: 1px solid #ddd; 
            padding: 12px; 
            text-align: left; 
        }
        
        th { 
            background-color: #DCA806; 
            color: white; 
        }
        
        /* Efek baris tabel */
        tr:nth-child(even) { 
            background-color: #FFFBF2; 
        }
        
        tr:hover { 
            background-color: #FFE7B2; 
        }
    </style>
</head>
<body>
    <h2>Data Detail Pendaftar (Dummy)</h2>
    <table>
        <tr>
            <th>Nama Lengkap</th>
            <th>NIM</th>
            <th>Kelas</th>
            <th>Status</th>
        </tr>
        <tr>
            <td>Omar Athaya Vito</td>
            <td>123140198</td>
            <td>RB</td>
            <td>Terdaftar</td>
        </tr>
        <tr>
            <td>Sineva AL Desmo</td>
            <td>119140110</td>
            <td>RA</td>
            <td>Terdaftar</td>
        </tr>
    </table>
</body>
</html>
